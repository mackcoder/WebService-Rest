<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .bg{fill:#0f172a}
    .t{fill:#e2e8f0;font-size:15px;font-weight:600;text-anchor:middle}
    .s{fill:#94a3b8;font-size:12px;text-anchor:middle}
    .m{font-family:Consolas, monospace;font-size:13px}
    .gate{fill:#1e293b;stroke:#a78bfa;stroke-width:2}
    .ok,.bad{opacity:0}
    .ok{animation:ok 6s infinite}
    .bad{animation:bad 6s infinite}
    .okr{opacity:0;animation:okr 6s infinite}
    .badr{opacity:0;animation:badr 6s infinite}
    @keyframes ok{0%{opacity:1;transform:translateX(0)}22%{opacity:1;transform:translateX(225px)}40%{opacity:1;transform:translateX(560px)}45%,100%{opacity:0;transform:translateX(560px)}}
    @keyframes okr{0%,40%{opacity:0}45%,95%{opacity:1}100%{opacity:0}}
    @keyframes bad{0%{opacity:1;transform:translateX(0)}22%{opacity:1;transform:translateX(225px)}30%{opacity:1;transform:translateX(215px)}45%,100%{opacity:0;transform:translateX(215px)}}
    @keyframes badr{0%,25%{opacity:0}30%,95%{opacity:1}100%{opacity:0}}
  </style>
  <rect class="bg" width="860" height="260" rx="16"/>
  <text x="430" y="34" class="t" style="font-size:17px">Ex. 5 · Validação do ID antes de processar</text>

  <rect class="gate" x="380" y="60" width="110" height="170" rx="12"/>
  <text x="435" y="135" class="t">🛡️ valida</text>
  <text x="435" y="155" class="s">inteiro &gt; 0 ?</text>

  <!-- valid -->
  <g class="ok"><rect x="40" y="78" width="104" height="28" rx="14" fill="#4ade80"/><text x="92" y="97" class="m" text-anchor="middle" fill="#0f172a">/estoque/1</text></g>
  <g class="okr"><rect x="640" y="72" width="190" height="40" rx="10" fill="#14532d" stroke="#4ade80"/><text x="735" y="97" class="m" text-anchor="middle" fill="#bbf7d0">200 ✅ {nome, estoque}</text></g>

  <!-- invalid -->
  <g class="bad"><rect x="40" y="168" width="112" height="28" rx="14" fill="#f87171"/><text x="96" y="187" class="m" text-anchor="middle" fill="#0f172a">/estoque/-5</text></g>
  <g class="badr"><rect x="530" y="160" width="300" height="44" rx="10" fill="#450a0a" stroke="#f87171"/><text x="680" y="180" class="m" text-anchor="middle" fill="#fecaca">400 ❌ INVALID_ID</text><text x="680" y="196" class="s" fill="#fca5a5" style="fill:#fca5a5">"O ID deve ser um inteiro positivo"</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
