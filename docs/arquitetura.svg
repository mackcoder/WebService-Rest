<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<style>
.bt{font-size:17px;font-weight:700;fill:#fff;text-anchor:middle}
.bs{font-size:12.5px;fill:#fff;opacity:.9;text-anchor:middle}
.lbl{font-size:13px;fill:#374151}
.mono{font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:12.5px;fill:#111827}
.tag{font-size:12px;font-weight:700;fill:#fff}
@keyframes k0{0%,2%{transform:translate(405px,130px);opacity:0}2.5%{opacity:1}21.5%{opacity:1}22%{transform:translate(265px,310px);opacity:0}100%{transform:translate(265px,310px);opacity:0}}.p0{animation:k0 7s linear infinite}@keyframes k1{0%,22%{transform:translate(265px,310px);opacity:0}22.5%{opacity:1}39.5%{opacity:1}40%{transform:translate(405px,130px);opacity:0}100%{transform:translate(405px,130px);opacity:0}}.p1{animation:k1 7s linear infinite}@keyframes k2{0%,2%{transform:translate(555px,130px);opacity:0}2.5%{opacity:1}21.5%{opacity:1}22%{transform:translate(695px,310px);opacity:0}100%{transform:translate(695px,310px);opacity:0}}.p2{animation:k2 7s linear infinite}@keyframes k3{0%,22%{transform:translate(695px,310px);opacity:0}22.5%{opacity:1}39.5%{opacity:1}40%{transform:translate(555px,130px);opacity:0}100%{transform:translate(555px,130px);opacity:0}}.p3{animation:k3 7s linear infinite}@keyframes k4{0%,52%{transform:translate(620px,360px);opacity:0}52.5%{opacity:1}67.5%{opacity:1}68%{transform:translate(345px,360px);opacity:0}100%{transform:translate(345px,360px);opacity:0}}.p4{animation:k4 7s linear infinite}@keyframes k5{0%,68%{transform:translate(345px,360px);opacity:0}68.5%{opacity:1}83.5%{opacity:1}84%{transform:translate(620px,360px);opacity:0}100%{transform:translate(620px,360px);opacity:0}}.p5{animation:k5 7s linear infinite}@keyframes ph1{0%,1%{opacity:0}3%,40%{opacity:1}44%,100%{opacity:.18}}.ph1{animation:ph1 7s linear infinite}@keyframes ph2{0%,50%{opacity:.18}53%,86%{opacity:1}90%,100%{opacity:.18}}.ph2{animation:ph2 7s linear infinite}
</style>
<rect x=".5" y=".5" width="959" height="469" rx="16" fill="#fff" stroke="#E5E7EB"/>
<text x="32" y="40" font-size="20" font-weight="700" fill="#111827">Arquitetura: dois serviços, duas linguagens, um contrato HTTP/JSON</text>

<line x1="405" y1="130" x2="265" y2="310" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="7 6"/>
<line x1="555" y1="130" x2="695" y2="310" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="7 6"/>
<line x1="620" y1="360" x2="345" y2="360" stroke="#FCD34D" stroke-width="3" stroke-dasharray="7 6"/>

<rect x="355.0" y="56.0" width="250" height="78" rx="14" fill="#2563EB"/><text x="480" y="85" class="bt">Cliente Python</text><text x="480" y="107" class="bs">cliente_relatorio.py</text><text x="480" y="125" class="bs">requests</text>
<rect x="55.0" y="305.0" width="290" height="100" rx="14" fill="#16A34A"/><text x="200" y="345" class="bt">Flask · porta 5000</text><text x="200" y="367" class="bs">app.py — serviço fiscal</text><text x="200" y="385" class="bs">preço · categoria · imposto 20%</text>
<rect x="615.0" y="305.0" width="290" height="100" rx="14" fill="#7C3AED"/><text x="760" y="345" class="bt">Node.js · porta 3000</text><text x="760" y="367" class="bs">server.js — serviço de estoque</text><text x="760" y="385" class="bs">nome · estoque · proxy</text>

<g class="ph1">
 <rect x="150" y="190" width="170" height="26" rx="13" fill="#2563EB"/><text x="235" y="208" class="tag" text-anchor="middle">Ex. 1 · GET /detalhes/1</text>
 <rect x="640" y="190" width="170" height="26" rx="13" fill="#2563EB"/><text x="725" y="208" class="tag" text-anchor="middle">Ex. 1 · GET /estoque/1</text>
</g>
<g class="ph2">
 <rect x="378" y="380" width="205" height="26" rx="13" fill="#D97706"/><text x="480" y="398" class="tag" text-anchor="middle">Ex. 2 · Node chama o Flask</text>
 <text x="480" y="428" class="mono" text-anchor="middle">GET /api/full-info/1 → fetch(/detalhes/1)</text>
</g>
<circle class="p0" r="9" fill="#2563EB" stroke="#fff" stroke-width="2"/><circle class="p1" r="9" fill="#059669" stroke="#fff" stroke-width="2"/><circle class="p2" r="9" fill="#2563EB" stroke="#fff" stroke-width="2"/><circle class="p3" r="9" fill="#059669" stroke="#fff" stroke-width="2"/><circle class="p4" r="9" fill="#D97706" stroke="#fff" stroke-width="2"/><circle class="p5" r="9" fill="#059669" stroke="#fff" stroke-width="2"/>

<circle cx="40" cy="452" r="6" fill="#2563EB"/><text x="52" y="456" class="lbl">requisição do cliente</text>
<circle cx="215" cy="452" r="6" fill="#D97706"/><text x="227" y="456" class="lbl">requisição servidor→servidor</text>
<circle cx="440" cy="452" r="6" fill="#059669"/><text x="452" y="456" class="lbl">resposta JSON</text>
</svg>