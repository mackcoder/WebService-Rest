<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .bg{fill:#0f172a}
    .box{fill:#1e293b;stroke-width:2}
    .t{fill:#e2e8f0;font-size:15px;font-weight:600;text-anchor:middle}
    .s{fill:#94a3b8;font-size:12px;text-anchor:middle}
    .lbl{fill:#cbd5e1;font-size:12px;text-anchor:middle;font-family:Consolas, monospace}
    .line{stroke:#334155;stroke-width:2;stroke-dasharray:6 6}
    .p{opacity:0}
    .p1{animation:a1 8s infinite}
    .p2{animation:a2 8s infinite}
    .p3{animation:a3 8s infinite}
    .p4{animation:a4 8s infinite}
    @keyframes a1{0%{opacity:1;transform:translateX(0)}20%{opacity:1;transform:translateX(315px)}21%,100%{opacity:0;transform:translateX(315px)}}
    @keyframes a2{0%,22%{opacity:0;transform:translateX(0)}23%{opacity:1}43%{opacity:1;transform:translateX(315px)}44%,100%{opacity:0;transform:translateX(315px)}}
    @keyframes a3{0%,46%{opacity:0;transform:translateX(0)}47%{opacity:1}67%{opacity:1;transform:translateX(-315px)}68%,100%{opacity:0;transform:translateX(-315px)}}
    @keyframes a4{0%,70%{opacity:0;transform:translateX(0)}71%{opacity:1}91%{opacity:1;transform:translateX(-315px)}92%,100%{opacity:0;transform:translateX(-315px)}}
    .hide{animation:pulse 2.4s infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
  </style>
  <rect class="bg" width="860" height="300" rx="16"/>
  <text x="430" y="34" class="t" style="font-size:17px">Ex. 2 · Proxy server-to-server (API Gateway)</text>

  <!-- boxes -->
  <rect class="box" x="40" y="90" width="150" height="90" rx="12" stroke="#38bdf8"/>
  <text x="115" y="128" class="t">🧑‍💻 Cliente</text>
  <text x="115" y="150" class="s">só conhece o Node</text>

  <rect class="box" x="355" y="90" width="150" height="90" rx="12" stroke="#4ade80"/>
  <text x="430" y="128" class="t">🟩 Node :3000</text>
  <text x="430" y="150" class="s">estoque + gateway</text>

  <rect class="box" x="670" y="90" width="150" height="90" rx="12" stroke="#f472b6"/>
  <text x="745" y="128" class="t">🐍 Flask :5000</text>
  <text x="745" y="150" class="s">serviço fiscal</text>
  <rect x="660" y="80" width="170" height="110" rx="16" fill="none" stroke="#f472b6" stroke-dasharray="4 6" class="hide"/>

  <line class="line" x1="190" y1="135" x2="355" y2="135"/>
  <line class="line" x1="505" y1="135" x2="670" y2="135"/>

  <!-- packets -->
  <g class="p p1"><rect x="50" y="56" width="130" height="24" rx="12" fill="#38bdf8"/><text x="115" y="73" class="lbl" style="fill:#0f172a">GET /full-info/1</text></g>
  <g class="p p2"><rect x="362" y="56" width="136" height="24" rx="12" fill="#4ade80"/><text x="430" y="73" class="lbl" style="fill:#0f172a">fetch /detalhes/1</text></g>
  <g class="p p3"><rect x="673" y="194" width="144" height="24" rx="12" fill="#f472b6"/><text x="745" y="211" class="lbl" style="fill:#0f172a">{preco, categoria}</text></g>
  <g class="p p4"><rect x="340" y="194" width="180" height="24" rx="12" fill="#facc15"/><text x="430" y="211" class="lbl" style="fill:#0f172a">{nome, estoque, preco…}</text></g>

  <text x="430" y="262" class="s">O Node consulta o Flask, funde os dois JSONs e devolve o produto completo · integração no <tspan style="fill:#4ade80;font-weight:700">servidor</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
